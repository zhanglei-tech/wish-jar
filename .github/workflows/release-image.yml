name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 git tag，例如 v1.0.0"
        required: true
        type: string
      platforms:
        description: "目标架构，例如 linux/amd64 或 linux/amd64,linux/arm64"
        required: false
        default: linux/amd64
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 计算镜像名与目标架构
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORMS=${{ github.event_name == 'workflow_dispatch' && inputs.platforms || vars.IMAGE_PLATFORMS || 'linux/amd64' }}" >> "$GITHUB_ENV"

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入构建摘要
        run: |
          {
            echo "### 镜像已发布"
            echo ""
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "目标架构：${{ env.PLATFORMS }}"
          } >> "$GITHUB_STEP_SUMMARY"
