name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试与迁移
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: pytest -q

      - name: 验证 Alembic 迁移
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          rm -f ci-migration.db ci-migration.db-wal ci-migration.db-shm
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          rm -f ci-migration.db ci-migration.db-wal ci-migration.db-shm

  frontend:
    name: 前端构建与类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 类型检查
        run: npm run typecheck
